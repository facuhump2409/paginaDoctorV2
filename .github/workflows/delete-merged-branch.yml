name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch &&
      github.event.pull_request.head.ref != 'master' &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        uses: actions/github-script@v7
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const ref = `heads/${process.env.HEAD_REF}`;
            try {
              await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref });
              core.info(`Deleted ${ref}`);
            } catch (e) {
              if (e.status === 404 || e.status === 422) {
                core.info(`Branch already deleted or not found: ${ref}`);
              } else {
                throw e;
              }
            }
